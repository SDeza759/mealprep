  function handleRegenerateSelected() {
    if (!plan || !pctValid) return;
    // Expand selection to full groups; drop persistently-excluded days.
    var regenSet = {};
    Object.keys(regenSel).forEach(function(k) {
      if (!regenSel[k]) return;
      var di = parseInt(k, 10);
      var gi = findDayGroup(di);
      var members = gi !== -1 ? dayGroups[gi] : [di];
      members.forEach(function(d) { if (excludedDays.indexOf(d) === -1) regenSet[d] = true; });
    });
    var regenList = Object.keys(regenSet).map(function(k) { return parseInt(k, 10); });
    if (regenList.length === 0) return;

    // Exclude every day not being regenerated (this also keeps persistently-excluded days out).
    var excludedForCall = [];
    for (var d = 0; d < 7; d++) { if (!regenSet[d]) excludedForCall.push(d); }

    // Seed week trackers from kept days (active, not regenerated) so new days don't duplicate them.
    var seed = { recipeNames: {}, cuisineCounts: {} };
    plan.forEach(function(day, di) {
      if (!day || regenSet[di] || excludedDays.indexOf(di) !== -1) return;
      day.meals.forEach(function(meal) {
        seed.recipeNames[meal.name] = true;
        seed.cuisineCounts[meal.cuisine] = (seed.cuisineCounts[meal.cuisine] || 0) + 1;
      });
    });

    var p = generatePlan(calories, carbGrams, proteinGrams, fatGrams, ingredientOverrides, dayGroups, excludedForCall, seed, resolvedMealCounts());
    // Build explicitly over all 7 indices: generatePlan leaves excluded days as array HOLES, and
    // Array.prototype.map skips holes — so regenerating a day that was previously excluded would
    // silently drop the new day on the floor.
    var newPlan = Array.from({length: 7}, function(_, di) { return regenSet[di] ? p[di] : plan[di]; });
    setPlan(newPlan);
    setRegenSel({});
    // Clear eaten/servings for regenerated days (their meals changed).
    var ne = Object.assign({}, eatenMeals), nsv = Object.assign({}, mealServings);
    Object.keys(ne).forEach(function(key) { if (regenSet[parseInt(key, 10)]) delete ne[key]; });
    Object.keys(nsv).forEach(function(key) { if (regenSet[parseInt(key, 10)]) delete nsv[key]; });
    setEatenMeals(ne); setMealServings(nsv);
  }

  function toggleEaten(dayIdx, mealIdx) {
    var key = dayIdx + "-" + mealIdx;
    var next = Object.assign({}, eatenMeals);
    if (next[key]) { delete next[key]; } else { next[key] = true; }
    setEatenMeals(next);
  }

  function toggleFavorite(name) {
    if (!name) return;
    var next = Object.assign({}, favorites);
    if (next[name]) { delete next[name]; } else { next[name] = true; }
    setFavorites(next);
    localStorage.setItem("mealprep_favorites", JSON.stringify(next));
  }

  function handleLogEaten() {
    if (!plan || Object.keys(eatenMeals).length === 0) return;
    var updated = recordEatenMeals(plan, eatenMeals, calories, carbGrams, proteinGrams, fatGrams);
    setStatsData(updated);
    setStatsNewData(true);
    setCopyMsg("Logged " + Object.keys(eatenMeals).length + " meals!");
    setTimeout(function() { setCopyMsg(""); }, 2500);
    setEatenMeals({});
  }

  var eatenCount = Object.keys(eatenMeals).length;

  function handleSave() {
    if (!plan || !saveName.trim()) return;
    var entry = { name: saveName.trim(), date: new Date().toLocaleDateString(), calories: calories, carbPct: carbPct, proteinPct: proteinPct, fatPct: fatPct, plan: plan, planGroups: planGroups };
    var updated = [entry, ...savedPlans.filter(function(p) { return p.name !== saveName.trim(); })];
    setSavedPlans(updated); localStorage.setItem("mealprep_plans", JSON.stringify(updated)); setSaveName("");
    setCopyMsg("Plan saved!"); setTimeout(function() { setCopyMsg(""); }, 2000);
  }
  function handleLoad(entry) {
    setCalories(entry.calories); setCarbPct(entry.carbPct); setProteinPct(entry.proteinPct); setFatPct(entry.fatPct); setPlan(entry.plan); setView("plan");
    setPlanGroups(entry.planGroups || null);
    var ed = {};
    entry.plan.forEach(function(day, di) { if (day) ed[di] = true; });
    setExpandedDays(ed); setExpandedMeals({});
  }
  function handleDeleteSaved(name) { var u = savedPlans.filter(function(p) { return p.name !== name; }); setSavedPlans(u); localStorage.setItem("mealprep_plans", JSON.stringify(u)); }

  function handleCopyGrocery() {
    var text = groceryToText(groceryList);
    // Include protein shake in copy if any days need it
    if (plan) {
      var shakeScoops = 0;
      plan.forEach(function(day) { if (day && day.proteinShake) shakeScoops += day.proteinShake.scoops; });
      if (shakeScoops > 0) text += "\nSupplements\n-----------\n  Protein Powder - " + shakeScoops + " scoops (~" + (shakeScoops*30) + "g)\n      serving 1 scoop (~30g): 120 cal · 3g C · 25g P · 1g F\n";
    }
    navigator.clipboard.writeText(text).then(function() { setCopyMsg("Copied!"); setTimeout(function() { setCopyMsg(""); }, 2000); });
  }

  function handleSwap(newRecipe) {
    if (!swapTarget || !plan) return;
    var di = swapTarget.dayIdx, mi = swapTarget.mealIdx;

    // Grouped days must stay identical: build the swapped + re-solved day ONCE from the
    // interacted day (di), then write a deep clone of it to every member of di's group.
    // This also heals a group that had already diverged from earlier per-day edits.
    var members = planGroupMembers(di);
    var memberSet = {}; members.forEach(function(d) { memberSet[d] = true; });
    var srcDay = plan[di] || EMPTY_DAY; // adding into a day that has no plan entry yet
    var isAdd = !!swapTarget.isAdd;

    // Pick the variant here. The picker used to do this as a by-product of scoring every
    // candidate; with scoring gone this is the only place it happens — and it is required, not an
    // optimisation: selectVariant is variants-only, so a recipe carrying a `variants` array has no
    // usable base and would otherwise be swapped in with placeholder ingredients.
    // Budget = the day's targets minus what the other meals already spend. On the add path mi is
    // one past the end, so nothing is skipped and every existing meal counts as used budget.
    var swapIngs = newRecipe.ingredients, swapVariantLabel = null;
    if (newRecipe.variants && newRecipe.variants.length > 0) {
      var used = { cal: 0, carbs: 0, pro: 0, fat: 0 };
      srcDay.meals.forEach(function(m, mealI) {
        if (mealI === mi) return;
        m.ingredients.forEach(function(i) {
          if (!i.isSpice) { used.cal += i.calories; used.carbs += i.carbs; used.pro += i.protein; used.fat += i.fat; }
        });
      });
      var tmp = { variants: newRecipe.variants, selectedVariant: null };
      selectVariant(tmp, Math.max(1, calories - used.cal), Math.max(0.1, carbGrams - used.carbs),
                         Math.max(0.1, proteinGrams - used.pro), Math.max(0.1, fatGrams - used.fat));
      if (tmp.selectedVariant) { swapIngs = tmp.selectedVariant.ingredients; swapVariantLabel = tmp.selectedVariant.label; }
    }

    var newMealObj = { originalName: newRecipe.name, name: newRecipe.name, cuisine: newRecipe.cuisine,
      isBreakfast: newRecipe.tags.indexOf("breakfast") !== -1, variantLabel: swapVariantLabel,
      ingredients: swapIngs.map(function(i) { return Object.assign({}, i, { adjustment: null }); }), totalMacros: { ...newRecipe.totalMacros } };
    var cloneMeal = function(meal) { return { ...meal, ingredients: meal.ingredients.map(function(i) { return { ...i }; }) }; };
    // Add appends at mi (== current length); swap replaces the meal at mi. Either way newMeals[mi]
    // ends up holding the chosen recipe, so everything downstream is shared.
    var newMeals = isAdd
      ? srcDay.meals.map(cloneMeal).concat([newMealObj])
      : srcDay.meals.map(function(meal, mealI) { return mealI === mi ? newMealObj : cloneMeal(meal); });
    var mealData = newMeals.map(function(m) {
      var ings = m.ingredients.map(function(i) { return Object.assign({}, i, { adjustment: null }); });
      applyIngredientOverrides(ings, ingredientOverrides);
      return { recipe: { name: m.name, tags: m.isBreakfast ? ["breakfast"] : [], selectedVariant: m.variantLabel ? { label: m.variantLabel } : null }, ingredients: ings };
    });
    adjustDayMeals(mealData, calories, carbGrams, proteinGrams, fatGrams);
    var dayTotals = { calories:0, carbs:0, protein:0, fat:0 };
    var rebuilt = mealData.map(function(md, idx) {
      var mt = md.ingredients.filter(function(i){return !i.isSpice;}).reduce(function(a, i) { return { calories:a.calories+i.calories, carbs:a.carbs+i.carbs, protein:a.protein+i.protein, fat:a.fat+i.fat }; }, { calories:0, carbs:0, protein:0, fat:0 });
      dayTotals.calories += mt.calories; dayTotals.carbs += mt.carbs; dayTotals.protein += mt.protein; dayTotals.fat += mt.fat;
      // newMeals[mi] already holds the chosen recipe on both paths, so read everything from it.
      return { originalName: newMeals[idx].originalName || newMeals[idx].name, name: newMeals[idx].name,
        cuisine: newMeals[idx].cuisine, isBreakfast: md.recipe.tags.indexOf("breakfast") !== -1,
        variantLabel: newMeals[idx].variantLabel || null,
        ingredients: md.ingredients, totalMacros: mt };
    });
    // Re-evaluate the protein shake from scratch (mirrors generatePlan and handleRemoveMeal).
    // Adding or swapping a meal moves protein a lot, so a stale shake would leave the day's
    // displayed totals and its shake column disagreeing.
    var proteinShake = null;
    if (proteinGrams - dayTotals.protein > proteinGrams * 0.10) {
      proteinShake = { scoops: 1, protein: 25, carbs: 3, fat: 1, calories: 120 };
      dayTotals.calories += 120; dayTotals.carbs += 3; dayTotals.protein += 25; dayTotals.fat += 1;
    }
    var computedDay = Object.assign({}, srcDay, { meals: rebuilt, totals: { calories: round1(dayTotals.calories), carbs: round1(dayTotals.carbs), protein: round1(dayTotals.protein), fat: round1(dayTotals.fat) }, proteinShake: proteinShake });

    // Array.from over all 7 indices, not plan.map — plan can be sparse (excluded days are holes)
    // and map skips holes, which would drop the written day.
    var newPlan = Array.from({length: 7}, function(_, dayI) {
      if (!memberSet[dayI]) return plan[dayI];
      var cloned = JSON.parse(JSON.stringify(computedDay));
      cloned.day = dayI;
      return cloned;
    });
    // Check if solver result is in zone
    var newDay = newPlan[di];
    if (newDay) {
      var t = newDay.totals;
      var cp = t.calories / calories * 100, bp = t.carbs / carbGrams * 100, pp = t.protein / proteinGrams * 100, fp = t.fat / fatGrams * 100;
      if (cp < 95 || cp > 105 || bp < 95 || bp > 105 || pp < 95 || pp > 105 || fp < 95 || fp > 105) {
        setSwapWarning("This day's macros are outside the 95-105% target range" + (isAdd ? " after adding a meal." : ".") + " Consider swapping again or regenerating.");
        setTimeout(function() { setSwapWarning(null); }, 5000);
      }
    }
    setPlan(newPlan); setSwapTarget(null);
  }

  // Open the recipe picker in "append" mode for day di. Reuses the swap modal; handleSwap does the
  // actual append. Capped at MAX_MEALS to match the generator's range.
  function openAddMeal(di) {
    if (!plan) return;
    var count = plan[di] ? plan[di].meals.length : 0; // a day with no plan entry starts at 0
    if (count >= MAX_MEALS) return;
    setDetailModal(null); setDetailInstrOpen(false);
    setSwapTarget({ dayIdx: di, mealIdx: count, isAdd: true });
    setSwapSearch("");
  }

  // Remove a meal from a day and re-solve the remaining meals to hit the daily targets.
  // Removing the LAST meal is allowed and empties the day: no solve, zero totals, no shake.
  // An empty day still renders its row (with the "+" affordance) and is skipped by the
  // weekly averages, so clearing one day leaves the other six untouched.
  function handleRemoveMeal(di, mi) {
    if (!plan || !plan[di] || plan[di].meals.length < 1) return;

    // Grouped days stay identical: remove + re-solve ONCE from the interacted day (di),
    // then copy the result to every member of di's group (healing any prior divergence).
    var members = planGroupMembers(di);
    var memberSet = {}; members.forEach(function(d) { memberSet[d] = true; });
    var srcDay = plan[di];

    var remaining = srcDay.meals.filter(function(_, idx) { return idx !== mi; });
    var mealData = remaining.map(function(m) {
      var ings = m.ingredients.map(function(i) { return Object.assign({}, i, { adjustment: null }); });
      applyIngredientOverrides(ings, ingredientOverrides);
      return { recipe: { name: m.name, tags: m.isBreakfast ? ["breakfast"] : [], selectedVariant: m.variantLabel ? { label: m.variantLabel } : null }, ingredients: ings };
    });
    var isNowEmpty = remaining.length === 0;
    if (!isNowEmpty) adjustDayMeals(mealData, calories, carbGrams, proteinGrams, fatGrams);
    var dayTotals = { calories:0, carbs:0, protein:0, fat:0 };
    var rebuilt = mealData.map(function(md, idx) {
      var mt = md.ingredients.filter(function(i){return !i.isSpice;}).reduce(function(a, i) { return { calories:a.calories+i.calories, carbs:a.carbs+i.carbs, protein:a.protein+i.protein, fat:a.fat+i.fat }; }, { calories:0, carbs:0, protein:0, fat:0 });
      dayTotals.calories += mt.calories; dayTotals.carbs += mt.carbs; dayTotals.protein += mt.protein; dayTotals.fat += mt.fat;
      return { originalName: remaining[idx].name, name: remaining[idx].name, cuisine: remaining[idx].cuisine,
        isBreakfast: md.recipe.tags.indexOf("breakfast") !== -1, variantLabel: remaining[idx].variantLabel || null,
        ingredients: md.ingredients, totalMacros: mt };
    });
    // Re-evaluate protein shake from scratch (mirrors generatePlan) — but never bolt a shake
    // onto a day the user just emptied.
    var proteinShake = null;
    if (!isNowEmpty && proteinGrams - dayTotals.protein > proteinGrams * 0.10) {
      proteinShake = { scoops: 1, protein: 25, carbs: 3, fat: 1, calories: 120 };
      dayTotals.calories += 120; dayTotals.carbs += 3; dayTotals.protein += 25; dayTotals.fat += 1;
    }
    var computedDay = Object.assign({}, srcDay, { meals: rebuilt, totals: { calories: round1(dayTotals.calories), carbs: round1(dayTotals.carbs), protein: round1(dayTotals.protein), fat: round1(dayTotals.fat) }, proteinShake: proteinShake });

    // Array.from over all 7 indices, not plan.map — plan can be sparse (excluded days are holes)
    // and map skips holes, which would drop the written day.
    var newPlan = Array.from({length: 7}, function(_, dayI) {
      if (!memberSet[dayI]) return plan[dayI];
      var cloned = JSON.parse(JSON.stringify(computedDay));
      cloned.day = dayI;
      return cloned;
    });
    // An emptied day is intentional, not off-target — don't nag about its zero macros.
    var newDay = newPlan[di];
    if (newDay && !isNowEmpty) {
      var t = newDay.totals;
      var cp = t.calories / calories * 100, bp = t.carbs / carbGrams * 100, pp = t.protein / proteinGrams * 100, fp = t.fat / fatGrams * 100;
      if (cp < 95 || cp > 105 || bp < 95 || bp > 105 || pp < 95 || pp > 105 || fp < 95 || fp > 105) {
        setSwapWarning("This day's macros are outside the 95-105% target range after removing a meal. Consider swapping or regenerating.");
        setTimeout(function() { setSwapWarning(null); }, 5000);
      }
    }
    // Clear eaten/servings for every affected day (meal indices shifted on all of them).
    var ne = Object.assign({}, eatenMeals), nsv = Object.assign({}, mealServings);
    Object.keys(ne).forEach(function(key) { if (memberSet[parseInt(key, 10)]) delete ne[key]; });
    Object.keys(nsv).forEach(function(key) { if (memberSet[parseInt(key, 10)]) delete nsv[key]; });
    setEatenMeals(ne); setMealServings(nsv);
    setDetailModal(null); setDetailInstrOpen(false); setPlan(newPlan);
  }

  // Set slot `si`'s serving count, propagated to every day in di's group so grouped days
  // keep identical servings. `delta` is +1/-1 from di's current value; result is clamped ≥1.
  function changeServing(di, si, delta) {
    var members = planGroupMembers(di);
    var base = mealServings[di + "-" + si] || 1;
    var val = Math.max(1, base + delta);
    var n = Object.assign({}, mealServings);
    members.forEach(function(d) {
      var k = d + "-" + si;
      if (val === 1) delete n[k]; else n[k] = val;
    });
    setMealServings(n);
  }


  var groceryList = plan ? buildGroceryList(Array.from({length: 7}, function(_, di) { return excludedDays.indexOf(di) !== -1 ? null : (plan[di] || null); }), mealServings) : [];
  var filteredRecipes = RECIPES.filter(function(r) {
    var ms = !recipeSearch || r.name.toLowerCase().indexOf(recipeSearch.toLowerCase()) !== -1 || r.ingredients.some(function(i) { return i.name.toLowerCase().indexOf(recipeSearch.toLowerCase()) !== -1; });
    return ms && (recipeCuisine === "All" || r.cuisine === recipeCuisine);
  });


  function ingQtyDisplay(ing) {
    if (ing.isSpice) return spiceDisplay(ing.grams);
    var ud = getUnitDisplay(ing.name, ing.grams);
    if (ud) return ud;
    if (MEAT_INGREDIENTS.has(ing.name)) {
      // Keep the oz conversion as one unbreakable piece: a narrow column should break between
      // the two units ("307g" / "(10.8 oz)"), not inside the parenthetical ("(10.8" / "oz)").
      return <React.Fragment>{ing.grams}g <span className="md-qty-alt">({round1(ing.grams / 28.3495)} oz)</span></React.Fragment>;
    }
    return ing.grams + "g";
  }

  return (
    <div className="app">
      {autotestStatus && <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,0.85)',zIndex:9999,display:'flex',alignItems:'center',justifyContent:'center'}}>
        <div style={{background:'#1a1a2e',border:'1px solid #444',borderRadius:12,padding:'40px 48px',maxWidth:600,textAlign:'center',color:'#e0e0e0',fontFamily:'monospace'}}>
          <div style={{fontSize:18,fontWeight:'bold',marginBottom:16}}>Autotest Mode</div>
          <div style={{fontSize:14,lineHeight:1.6}}>{autotestStatus}</div>
          {validationProgress && !validationResults && <div style={{marginTop:16,fontSize:13,color:'#888'}}>Progress: {validationProgress.done}/{validationProgress.total} weeks</div>}
        </div>
      </div>}
      <h1>Actual Size Optimizer</h1>

      <div>
        <div className="card" style={{paddingBottom:12}}>
          <div className="sd-row1">
            <div>
              <div className="sd-label">Macro Targets</div>
              <div className="sd-macro-grid">
                <div className="input-group"><label>Calories</label><input type="number" value={calories} min={1000} max={5000} onChange={function(e){setCalories(Number(e.target.value));}} /></div>
                <div className="input-group"><label>Carbs %</label><input type="number" value={carbPct} min={0} max={100} onChange={function(e){setCarbPct(Number(e.target.value));}} /></div>
                <div className="input-group"><label>Protein %</label><input type="number" value={proteinPct} min={0} max={100} onChange={function(e){setProteinPct(Number(e.target.value));}} /></div>
                <div className="input-group"><label>Fat %</label><input type="number" value={fatPct} min={0} max={100} onChange={function(e){setFatPct(Number(e.target.value));}} /></div>
              </div>
              {!pctValid && <div className={"warning"+(Math.abs(pctSum-100)>10?" error":"")} style={{marginTop:4,fontSize:'0.78rem',padding:'4px 8px'}}>Percentages sum to {pctSum}% — must equal 100%</div>}
            </div>
            <div>
              <div className="sd-label">Day Grouping</div>
              <div className="sd-day-pills">
                {[0,1,2,3,4,5,6].map(function(d) {
                  var isExcluded = excludedDays.indexOf(d) !== -1;
                  var gi = findDayGroup(d);
                  var gc = gi !== -1 ? getGroupColor(gi) : null;
                  var isSelected = selectedDay === d;
                  var pillClass = "sd-dpill" + (isExcluded ? " dp-excluded" : "") + (isSelected ? " dp-selected" : "");
                  var pillStyle = {};
                  if (!isExcluded && gc) { pillStyle = { background: gc.bg, borderColor: gc.border }; }
                  return (<div className={pillClass} key={d} style={pillStyle}
                    onClick={function(e) {
                      if (clickTimer.current) { clearTimeout(clickTimer.current); clickTimer.current = null; handlePillDoubleClick(d); return; }
                      clickTimer.current = setTimeout(function() { clickTimer.current = null; if (isExcluded) { toggleExcludeDay(d); } else { handlePillClick(d); } }, 250);
                    }}
                    onContextMenu={function(e){e.preventDefault();toggleExcludeDay(d);}}>
                    <div className="dp-name" style={gc && !isExcluded ? {color: gc.text} : {}}>{DAYS_NAMES[d].slice(0,3)}</div>
                    <div className="dp-label" style={gc && !isExcluded ? {color: gc.text} : {}}>{isExcluded ? "off" : (gi !== -1 ? "G"+(gi+1) : "\u00A0")}</div>
                  </div>);
                })}
              </div>
              {allDaysExcluded && <div className="warning" style={{marginTop:6,fontSize:'0.72rem',padding:'3px 8px'}}>All days excluded</div>}
            </div>
          </div>
          {!allDaysExcluded && (function() {
            var units = planningUnits();
            if (!units.length) return null;
            return (<div className="sd-mealrow">
              <div className="sd-label">Meals Per Day<span className="sd-label-hint">grouped days share one setting</span></div>
              <div className="sd-mc-list">
                {units.map(function(u) {
                  var val = mealCountFor(u.lead);
                  var cardStyle = u.color ? { background: u.color.bg, borderColor: u.color.border } : {};
                  return (<div className="mc-card" key={u.key} style={cardStyle}>
                    <div className="mc-tag">
                      <span className="mc-tag-name" style={u.color ? {color: u.color.text} : {}}>{u.name}</span>
                      {u.daysLabel && <span className="mc-tag-days">{u.daysLabel}</span>}
                    </div>
                    <div className="mc-stepper">
                      <button onClick={function(){changeMealCount(u, -1);}} disabled={val <= MIN_MEALS} title="Fewer meals">−</button>
                      <span className="mc-val">{val}</span>
                      <button onClick={function(){changeMealCount(u, 1);}} disabled={val >= MAX_MEALS} title="More meals">+</button>
                    </div>
                  </div>);
                })}
              </div>
              {(function() {
                // A single calm heads-up instead of per-card noise: at extreme counts the day's
                // calories-per-meal falls outside what any recipe can scale to, so the solver
                // can't land in [95%,105%] no matter which recipes it picks.
                var strained = units.filter(function(u) {
                  var per = calories / mealCountFor(u.lead);
                  return per > 1100 || per < 350;
                });
                if (!strained.length) return null;
                var names = strained.map(function(u) { return u.name + " (" + Math.round(calories / mealCountFor(u.lead)) + " cal/meal)"; });
                return (<div className="warning" style={{marginTop:8,fontSize:'0.72rem',padding:'4px 8px'}}>
                  {names.join(", ")} {"—"} that's a lot to ask of one sitting, so these days may land off-target.
                </div>);
              })()}
            </div>);
          })()}
          <div className="sd-row2">
            <div className="sd-save-row">
              <div className="sd-label" style={{marginBottom:0}}>Saved Plans</div>
              <input placeholder="Plan name..." value={saveName} onChange={function(e){setSaveName(e.target.value);}} />
              <button className="btn btn-sm btn-primary" onClick={handleSave} disabled={!plan||!saveName.trim()}>Save</button>
              {copyMsg && <span className="copy-feedback" style={{fontSize:'0.78rem'}}>{copyMsg}</span>}
            </div>
            {savedPlans.length > 0 && <div className="sd-saved-scroll">
              {savedPlans.map(function(sp, i) {
                return <div className="sd-saved-item" key={i}><div><span className="sp-name">{sp.name}</span><span className="sp-meta">{sp.date} — {sp.calories} cal</span></div>
                  <div className="sp-actions"><button className="btn btn-sm btn-secondary" onClick={function(){handleLoad(sp);}}>Load</button><button className="btn btn-sm btn-danger" onClick={function(){handleDeleteSaved(sp.name);}}>Del</button></div></div>;
              })}
            </div>}
          </div>
        </div>
      </div>

      <div className="btn-row" style={{justifyContent:'flex-end'}}>
        {plan && Object.keys(regenSel).filter(function(k){return regenSel[k];}).length > 0 &&
          <button className="btn btn-secondary" onClick={handleRegenerateSelected} disabled={!pctValid}>Regenerate selected ({Object.keys(regenSel).filter(function(k){return regenSel[k];}).length})</button>}
        <button className="btn btn-primary" onClick={handleGenerate} disabled={!pctValid || allDaysExcluded}>Generate Weekly Plan</button>
      </div>

      {/* Tab bar — always visible */}
      <div className="btn-row">
        {plan && <button className={"btn btn-toggle"+(view==="plan"?" active":"")} onClick={function(){setView("plan");}}>Meal Plan</button>}
        {plan && <button className={"btn btn-toggle"+(view==="grocery"?" active":"")} onClick={function(){setView("grocery");}}>Grocery List</button>}
        <button className={"btn btn-toggle"+(view==="recipes"?" active":"")} onClick={function(){setView("recipes");}}>All Recipes</button>
        <button className={"btn btn-toggle"+(view==="favorites"?" active":"")} onClick={function(){setView("favorites");}}>Favorites{Object.keys(favorites).length>0 ? " ("+Object.keys(favorites).length+")" : ""}</button>
        <button className={"btn btn-toggle"+(view==="ingredients"?" active":"")} onClick={function(){setView("ingredients");}}>Ingredients</button>
        <button className={"btn btn-toggle"+(view==="stats"?" active":"")} onClick={function(){setView("stats");setStatsNewData(false);setLastStatsView(Date.now());localStorage.setItem("mealprep_stats_last_view",String(Date.now()));}}>Stats{statsNewData && <span className="stats-badge"></span>}</button>
        {debugVisible && <button className={"btn btn-debug"+(view==="debug"?" active":"")} onClick={function(){setView("debug");}}>Debug Panel</button>}
      </div>

      {plan && (<>
        {view === "plan" && (<>
          <div className="btn-row" style={{justifyContent:'flex-end',marginBottom:12}}>
            <button className="btn btn-sm btn-primary" onClick={handleLogEaten} disabled={eatenCount === 0}>Log Meals</button>
          </div>
          {swapWarning && <div style={{background:'#fff3cd',color:'#856404',padding:'10px 16px',borderRadius:10,marginBottom:12,fontSize:'0.88rem',display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
            <span>{swapWarning}</span>
            <button onClick={function(){setSwapWarning(null);}} style={{background:'none',border:'none',color:'#856404',fontWeight:700,cursor:'pointer',fontSize:'1.1rem',lineHeight:1,padding:'0 4px'}}>{"\u00D7"}</button>
          </div>}
          {(function() {
            // Emptied days are skipped like excluded ones — otherwise a day the user cleared
            // would divide the weekly averages down as if it were a 0-calorie day they ate.
            var activeDays = plan.filter(function(day, di) { return day && day.meals.length > 0 && excludedDays.indexOf(di) === -1; });
            var nDays = activeDays.length;
            if (nDays === 0) return null;
            var sum = { cal: 0, carbs: 0, pro: 0, fat: 0 };
            activeDays.forEach(function(d) { sum.cal += d.totals.calories; sum.carbs += d.totals.carbs; sum.pro += d.totals.protein; sum.fat += d.totals.fat; });
            var avg = { cal: round1(sum.cal / nDays), carbs: round1(sum.carbs / nDays), pro: round1(sum.pro / nDays), fat: round1(sum.fat / nDays) };
            return (<div className="card" style={{marginBottom:16}}>
              <h2 style={{marginBottom:10}}>Weekly Summary</h2>
              <div className="weekly-summary">
                <div className="ws-total"><div className="ws-val">{Math.round(sum.cal).toLocaleString()}</div><div className="ws-lbl">Total Calories ({nDays} days)</div></div>
                <div className="ws-avgs">
                  <div className="ws-avg"><div className="ws-val">{Math.round(avg.cal).toLocaleString()}</div><div className="ws-pct">Avg Cal ({Math.round(avg.cal / calories * 100)}%)</div><div className="progress-bar"><div className={"progress-fill fill-cal"} style={{width: Math.min(avg.cal / calories * 100, 100) + "%"}}></div></div></div>
                  <div className="ws-avg"><div className="ws-val">{Math.round(avg.carbs)}g</div><div className="ws-pct">Avg Carbs ({Math.round(avg.carbs / carbGrams * 100)}%)</div><div className="progress-bar"><div className={"progress-fill fill-carb"} style={{width: Math.min(avg.carbs / carbGrams * 100, 100) + "%"}}></div></div></div>
                  <div className="ws-avg"><div className="ws-val">{Math.round(avg.pro)}g</div><div className="ws-pct">Avg Protein ({Math.round(avg.pro / proteinGrams * 100)}%)</div><div className="progress-bar"><div className={"progress-fill fill-pro"} style={{width: Math.min(avg.pro / proteinGrams * 100, 100) + "%"}}></div></div></div>
                  <div className="ws-avg"><div className="ws-val">{Math.round(avg.fat)}g</div><div className="ws-pct">Avg Fat ({Math.round(avg.fat / fatGrams * 100)}%)</div><div className="progress-bar"><div className={"progress-fill fill-fat"} style={{width: Math.min(avg.fat / fatGrams * 100, 100) + "%"}}></div></div></div>
                </div>
              </div>
            </div>);
          })()}
          {(function() {
            // Every non-excluded day gets a row, even one with no plan entry (a day that was
            // excluded when the plan was generated). Otherwise re-including it later leaves it
            // invisible — no checkbox to regenerate, no "+" to fill it.
            var activeDayIdx = [];
            for (var ad = 0; ad < 7; ad++) if (excludedDays.indexOf(ad) === -1) activeDayIdx.push(ad);
            if (activeDayIdx.length === 0) return null;
            var maxMeals = 0, anyCanAdd = false;
            activeDayIdx.forEach(function(di) {
              var day = plan[di] || EMPTY_DAY;
              var total = day.meals.length + (day.proteinShake ? 1 : 0);
              if (total > maxMeals) maxMeals = total;
              if (day.meals.length < MAX_MEALS) anyCanAdd = true;
            });
            if (maxMeals === 0) maxMeals = 1; // keep one meal column so empty rows still have structure
            // One extra column so a day already at the widest row still has somewhere to grow.
            // It is pinned narrow: an unsized column would be dealt a full meal slot's width.
            var totalCols = maxMeals + (anyCanAdd ? 1 : 0);
            var WK_ADD_COL_W = 40, WK_MEAL_COL_W = 190;
            return (<div className={"wk-table-scroll" + (wkNarrow ? " wk-narrow" : "")} ref={wkScrollRef}><table className="wk-table" style={{minWidth: (56 + maxMeals * WK_MEAL_COL_W + (anyCanAdd ? WK_ADD_COL_W : 0)) + "px"}}>
              <thead><tr><th></th>{Array.from({length: totalCols}, function(_, i) {
                var isAddCol = i >= maxMeals;
                return <th key={i} style={isAddCol ? {width: WK_ADD_COL_W} : null}>{isAddCol ? "" : "Meal " + (i + 1)}</th>;
              })}</tr></thead>
              <tbody>
                {activeDayIdx.map(function(di) {
                  var day = plan[di] || EMPTY_DAY;
                  var pgEntry = planGroups && planGroups[di];
                  var dgc = pgEntry ? pgEntry.color : null;
                  var dgi = pgEntry ? pgEntry.groupIndex : -1;
                  var allSlots = day.meals.slice();
                  if (day.proteinShake) allSlots.push({ _isShake: true, name: "Protein Shake", totalMacros: { calories: day.proteinShake.calories, protein: day.proteinShake.protein, carbs: day.proteinShake.carbs, fat: day.proteinShake.fat } });
                  return (<tr className="wk-row" key={di}>
                    <td className="wk-day-cell">
                      <label className="wk-regen-check" title="Select to regenerate this day" onClick={function(e){e.stopPropagation();}}>
                        <input type="checkbox" checked={!!regenSel[di]} onChange={function(){toggleRegenSel(di);}} />
                      </label>
                      <div>{DAYS_NAMES[di].slice(0, 3)}</div>
                      {dgc && <div className="wk-glabel" style={{background: dgc.bg, color: dgc.text, border: '1px solid ' + dgc.border}}>G{dgi + 1}</div>}
                    </td>
                    {Array.from({length: totalCols}, function(_, si) {
                      // Every row's "+" lives in the same trailing narrow column, so the buttons
                      // line up and a short row never spends a full meal column on one.
                      if (si >= maxMeals) {
                        return (<td className="wk-add-cell" key={si}>
                          {day.meals.length < MAX_MEALS &&
                            <button className="wk-add-btn" title={"Add a meal to " + DAYS_NAMES[di]} onClick={function(e){e.stopPropagation();openAddMeal(di);}}>+</button>}
                        </td>);
                      }
                      var slot = allSlots[si];
                      // First cell of an empty day says so, rather than reading as a broken row.
                      if (!slot && si === 0 && day.meals.length === 0) {
                        return <td className="wk-meal-cell wk-noday-cell" key={si}>No meals — select the day and regenerate, or use +</td>;
                      }
                      if (!slot) return <td className="wk-meal-cell wk-empty-cell" key={si}></td>;
                      if (slot._isShake) {
                        return (<td className="wk-meal-cell wk-shake-cell" key={si}>
                          <div className="wk-name-row"><span className="wk-meal-name">{slot.name}</span></div>
                          <div className="wk-meal-meta"><span className="wk-meal-macros">{Math.round(slot.totalMacros.calories)} cal</span></div>
                        </td>);
                      }
                      var mealKey = di + "-" + si;
                      var isEaten = !!eatenMeals[mealKey];
                      return (<td className="wk-meal-cell" key={si} onClick={function(){setDetailModal({dayIdx:di,mealIdx:si});setDetailInstrOpen(false);}}>
                        <div className="wk-stepper" onClick={function(e){e.stopPropagation();}}>
                          <button onClick={function(){changeServing(di, si, -1);}}>−</button>
                          <span className="wk-sv">{mealServings[mealKey] || 1}</span>
                          <button onClick={function(){changeServing(di, si, 1);}}>+</button>
                        </div>
                        <div className="wk-name-row">
                          <span className={"wk-eaten-circle" + (isEaten ? " checked" : "")} onClick={function(e){e.stopPropagation();toggleEaten(di, si);}}>{isEaten ? "\u2713" : ""}</span>
                          <span className="wk-meal-name">{slot.name}</span>
                          <span className={"fav-star"+(favorites[slot.originalName]?" active":"")} title="Toggle favorite" onClick={function(e){e.stopPropagation();toggleFavorite(slot.originalName);}}>{favorites[slot.originalName] ? "\u2605" : "\u2606"}</span>
                        </div>
                        <div className="wk-meal-meta">
                          <span className="cuisine-tag">{slot.cuisine}</span>
                          <span className="wk-meal-macros">{Math.round(slot.totalMacros.calories)} cal</span>
                        </div>
                      </td>);
                    })}
                  </tr>);
                })}
              </tbody>
            </table></div>);
          })()}
        </>)}

        {view === "grocery" && (<div className="card">
          <div className="grocery-top-bar"><h2 style={{margin:0}}>Weekly Grocery List</h2><button className="btn btn-sm btn-secondary" onClick={handleCopyGrocery}>Copy List</button></div>
          {copyMsg && <div className="success">{copyMsg}</div>}
          {groceryList.map(function(section, si) {
            return (<div className="grocery-section" key={si}><h3>{section.category}</h3>
              {section.items.map(function(item, ii) {
                return (<div className="grocery-item" key={ii}>
                  <span className="gi-name">{item.name}</span>
                  <span className="gi-qty">{groceryQtyText(item)}</span>
                  <span className="gi-alt"></span>
                  <span className="gi-usage">{[...new Set(item.appearances)].join(", ")}</span>
                  {groceryServingText(item) && <span className="gi-serving">{groceryServingText(item)}</span>}
                </div>);
              })}
            </div>);
          })}
          {plan && (function() {
            var shakeScoops = 0;
            plan.forEach(function(day) { if (day && day.proteinShake) shakeScoops += day.proteinShake.scoops; });
            if (shakeScoops === 0) return null;
            return (<div className="grocery-section"><h3>Supplements</h3>
              <div className="grocery-item">
                <span className="gi-name">Protein Powder</span>
                <span className="gi-qty">{shakeScoops} {shakeScoops === 1 ? "scoop" : "scoops"}</span>
                <span className="gi-alt">~{shakeScoops * 30}g</span>
                <span className="gi-usage">Protein shake supplement ({shakeScoops} {shakeScoops === 1 ? "day" : "days"} this week)</span>
                <span className="gi-serving">serving 1 scoop (~30g): 120 cal · 3g C · 25g P · 1g F</span>
              </div>
            </div>);
          })()}
        </div>)}
      </>)}

      {view === "recipes" && (<div className="card">
          <h2>Recipe Database ({RECIPES.length} recipes)</h2>
          <div className="recipe-filter-row">
            <input placeholder="Search recipes or ingredients..." value={recipeSearch} onChange={function(e){setRecipeSearch(e.target.value);}} style={{flex:1,minWidth:180}} />
            <select value={recipeCuisine} onChange={function(e){setRecipeCuisine(e.target.value);}}><option value="All">All Cuisines</option>{ALL_CUISINES.map(function(c){return <option key={c} value={c}>{c}</option>;})}</select>
          </div>
          <div style={{fontSize:'0.82rem',color:'#6b7f7a',marginBottom:12}}>Showing {filteredRecipes.length} recipes</div>
          <div className="recipe-grid" ref={recipeGridRef}>
            {filteredRecipes.reduce(function(acc, r, i) {
              var mainIngs = r.ingredients.filter(function(x){return !x.isSpice;});
              var spiceIngs = r.ingredients.filter(function(x){return x.isSpice;});
              var isSelected = expandedRecipe === r.name;
              acc.push(<div className={"recipe-browser-card" + (isSelected ? " rb-selected" : "")} key={"card-" + i} onClick={function(){setExpandedRecipe(isSelected ? null : r.name);}}>
                <div className="rb-header"><span className="rb-name">{r.name}</span><span style={{display:'flex',alignItems:'center',gap:6}}><span className="cuisine-tag">{r.cuisine}</span><span className={"fav-star"+(favorites[r.name]?" active":"")} title="Toggle favorite" onClick={function(e){e.stopPropagation();toggleFavorite(r.name);}}>{favorites[r.name] ? "★" : "☆"}</span></span></div>
                <div className="rb-ings">{mainIngs.map(function(ing){return ing.name;}).join(", ")}</div>
                {spiceIngs.length > 0 && <div className="rb-spices">Spices: {spiceIngs.map(function(s){return s.name;}).join(", ")}</div>}
                <div className="rb-macros"><span>Cal: {round1(r.totalMacros.calories)}</span><span>C: {round1(r.totalMacros.carbs)}g</span><span>P: {round1(r.totalMacros.protein)}g</span><span>F: {round1(r.totalMacros.fat)}g</span></div>
                <div style={{marginTop:4}}>{r.tags.map(function(t){return <span className="tag-pill" key={t} style={{marginRight:4}}>{t}</span>;})}</div>
              </div>);
              // Insert full-width panel after the last card in the row that contains the expanded recipe
              var rowStart = Math.floor(i / rbColCount) * rbColCount;
              var rowEnd = Math.min(rowStart + rbColCount - 1, filteredRecipes.length - 1);
              if (i === rowEnd && expandedRecipe) {
                var expR = null;
                for (var ri = rowStart; ri <= rowEnd; ri++) {
                  if (filteredRecipes[ri].name === expandedRecipe) { expR = filteredRecipes[ri]; break; }
                }
                if (expR) {
                  var cookData = RECIPE_COOKING_DATA[expR.name];
                  var expIdx = filteredRecipes.indexOf(expR);
                  var colInRow = expIdx - rowStart;
                  var colWidth = 100 / rbColCount;
                  var arrowLeft = colWidth * colInRow + colWidth / 2;
                  acc.push(<div className="rb-panel" key={"panel-" + i}>
                    <div className="rb-panel-arrow" style={{left: 'calc(' + arrowLeft + '% - 8px)'}}></div>
                    <div className="rb-panel-header">{expR.name}</div>
                    <div className="rb-panel-body">
                      <div className="rb-panel-col">
                        <div className="rb-panel-ings"><strong>Ingredients:</strong>
                          <ul style={{margin:'4px 0 0 0',paddingLeft:18}}>{expR.ingredients.map(function(ing, j) {
                            var label = ing.isSpice ? ing.name + " (spice)" : ing.name + " \u2014 " + round1(ing.grams) + "g";
                            return <li key={j}>{label}</li>;
                          })}</ul>
                        </div>
                        {expR.variants && expR.variants.length > 0 && <div className="rb-panel-variants"><strong>Variants: </strong>{expR.variants.map(function(v){return v.label;}).join(", ")}</div>}
                      </div>
                      <div className="rb-panel-col">
                        {cookData && <div className="rb-panel-time">Prep: {cookData.prepTime} | Cook: {cookData.cookTime}</div>}
                        {cookData && cookData.steps ? <div className="rb-panel-steps"><strong>Instructions:</strong>
                          <ol style={{marginTop:4}}>{cookData.steps.map(function(s, si) {
                            return <li key={si}>{s.replace(/^\d+\.\s*/, "")}</li>;
                          })}</ol>
                        </div> : <div style={{fontSize:'0.82rem',color:'#9b8b6e',fontStyle:'italic'}}>No cooking instructions available.</div>}
                      </div>
                    </div>
                  </div>);
                }
              }
              return acc;
            }, [])}
          </div>
        </div>)}

        {view === "favorites" && (function() {
          var favRecipes = RECIPES.filter(function(r){ return favorites[r.name]; });
          return (<div className="card">
            <h2>Favorites ({favRecipes.length})</h2>
            {favRecipes.length === 0
              ? <div style={{color:'#6b7f7a',fontSize:'0.9rem',padding:'12px 0'}}>No favorites yet. Tap the {"☆"} on any recipe, meal cell, or in the meal detail view to add it here.</div>
              : <div className="recipe-grid">{favRecipes.map(function(r){
                  var mainIngs = r.ingredients.filter(function(x){return !x.isSpice;});
                  return (<div className="recipe-browser-card" key={r.name}>
                    <div className="rb-header"><span className="rb-name">{r.name}</span><span style={{display:'flex',alignItems:'center',gap:6}}><span className="cuisine-tag">{r.cuisine}</span><span className="fav-star active" title="Remove from favorites" onClick={function(){toggleFavorite(r.name);}}>{"★"}</span></span></div>
                    <div className="rb-ings">{mainIngs.map(function(ing){return ing.name;}).join(", ")}</div>
                    <div className="rb-macros"><span>Cal: {round1(r.totalMacros.calories)}</span><span>C: {round1(r.totalMacros.carbs)}g</span><span>P: {round1(r.totalMacros.protein)}g</span><span>F: {round1(r.totalMacros.fat)}g</span></div>
                    <div style={{marginTop:4}}>{r.tags.map(function(t){return <span className="tag-pill" key={t} style={{marginRight:4}}>{t}</span>;})}</div>
                  </div>);
                })}</div>}
          </div>);
        })()}

        {view === "ingredients" && (function() {
          var allNames = Object.keys(DEFAULT_MACROS_PER100).sort();
          var filtered = allNames.filter(function(n) { return !ingSearch || n.toLowerCase().indexOf(ingSearch.toLowerCase()) !== -1; });
          return (<div className="card">
            <h2 style={{marginBottom:12}}>Ingredient Macros <span style={{fontWeight:400,fontSize:'0.85rem',color:'#6b7f7a'}}>(per 100g)</span></h2>
            <input placeholder="Search ingredients..." value={ingSearch} onChange={function(e){setIngSearch(e.target.value);}} style={{width:'100%',padding:'8px 12px',border:'1.5px solid #c8d6d0',borderRadius:8,fontSize:'0.9rem',marginBottom:12,outline:'none'}} />
            <div style={{overflowX:'auto'}}>
            <table className="override-table">
              <thead><tr><th>Ingredient</th><th>Category</th><th>Cal</th><th>Carbs</th><th>Protein</th><th>Fat</th></tr></thead>
              <tbody>
                {filtered.map(function(name) {
                  var def = DEFAULT_MACROS_PER100[name];
                  return (<tr key={name}>
                    <td style={{fontWeight:600,minWidth:140}}>{name}</td>
                    <td><span className="override-cat">{getCategory(name)}</span></td>
                    <td>{def.calories}</td>
                    <td>{def.carbs}</td>
                    <td>{def.protein}</td>
                    <td>{def.fat}</td>
                  </tr>);
                })}
              </tbody>
            </table>
            </div>
          </div>);
        })()}

      {view === "stats" && <StatsView statsData={statsData} onUpdate={function(d){setStatsData(d);}} savedPlans={savedPlans} onSavedPlansUpdate={function(sp){setSavedPlans(sp);localStorage.setItem("mealprep_plans",JSON.stringify(sp));}} />}

      {view === "debug" && debugVisible && (<div className="debug-panel">
        <h2>Debug Panel — Recipe Distribution Simulator</h2>
        <p style={{fontSize:'0.82rem',color:'#a6adc8',marginBottom:12}}>Runs {1000} meal plan generations using current macro targets. Read-only — no data is modified.</p>
        <button className="btn btn-debug" onClick={runSimulation} disabled={!!simProgress} style={{marginBottom:16}}>{simProgress ? "Running..." : "Run Distribution Simulation"}</button>

        {simProgress && (<div className="dbg-progress">
          <div style={{fontSize:'0.88rem',color:'#cdd6f4'}}>Simulating... {simProgress.done} / {simProgress.total}</div>
          <div className="dbg-progress-bar"><div className="dbg-progress-fill" style={{width: Math.round(simProgress.done/simProgress.total*100)+"%"}}></div></div>
        </div>)}

        {simResults && (<>
          <h3>Bias Summary</h3>
          <div className="dbg-summary">{simResults.summary}</div>

          <h3>Overall Recipe Frequency ({simResults.sorted.length} recipes, {simResults.totalSlots} total meal slots)</h3>
          {simResults.sorted.map(function(r) {
            var barColor = r.count === 0 ? "dbg-fill-red" : (r.pct < 2 ? "dbg-fill-yellow" : "dbg-fill-green");
            return (<div className="dbg-bar-row" key={r.name}>
              <span className="dbg-bar-name">{r.name}</span>
              <div className="dbg-bar-track"><div className={"dbg-bar-fill " + barColor} style={{width: Math.max(r.count > 0 ? 1 : 0, Math.round(r.count/simResults.maxCount*100))+"%"}}></div></div>
              <span className="dbg-bar-val">{r.count} ({r.pct}%)</span>
            </div>);
          })}

          <h3>Never Selected</h3>
          {simResults.neverSelected.length === 0 ? (<div className="dbg-pass">All recipes were selected at least once.</div>) : (
            <ul className="dbg-list">{simResults.neverSelected.map(function(r) { return <li key={r.name} style={{color:'#f38ba8'}}>{r.name}</li>; })}</ul>
          )}

          <h3>Rarely Selected (&lt;2% of slots)</h3>
          {simResults.rarelySelected.length === 0 ? (<div className="dbg-pass">No recipes below 2% threshold.</div>) : (
            <ul className="dbg-list">{simResults.rarelySelected.map(function(r) { return <li key={r.name}><span className="dbg-warn">{r.name}</span> — {r.pct}% ({r.count} times)</li>; })}</ul>
          )}

          <h3>Most Over-Selected (Top 10)</h3>
          <ul className="dbg-list">{simResults.top10.map(function(r) {
            return <li key={r.name}>{r.name} — {r.pct}% ({r.count} times){r.pct > 10 ? <span className="dbg-flag">OVER-REPRESENTED</span> : ""}</li>;
          })}</ul>

          <div style={{marginTop:20}}><button className="btn btn-debug" onClick={function() {
            var report = {
              timestamp: simResults.timestamp,
              weeksSimulated: simResults.weeksSimulated,
              totalMealSlots: simResults.totalSlots,
              macroTargets: simResults.macros,
              biasSummary: simResults.summary,
              recipeFrequency: simResults.sorted.map(function(r) { return { name: r.name, count: r.count, percentage: r.pct }; }),
              neverSelected: simResults.neverSelected.map(function(r) { return r.name; }),
              rarelySelected: simResults.rarelySelected.map(function(r) { return { name: r.name, count: r.count, percentage: r.pct }; }),
              top10OverSelected: simResults.top10.map(function(r) { return { name: r.name, count: r.count, percentage: r.pct, overRepresented: r.pct > 10 }; })
            };
            var blob = new Blob([JSON.stringify(report, null, 2)], { type: "application/json" });
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a"); a.href = url; a.download = "meal-distribution-report.json"; a.click();
            URL.revokeObjectURL(url);
          }}>Download Report</button></div>
        </>)}

        <div style={{borderTop:'1px solid #45475a',marginTop:24,paddingTop:20}}>
          <h2 style={{color:'#f38ba8',fontSize:'1.15rem',marginBottom:12}}>Ingredient Frequency Analysis</h2>
          <p style={{fontSize:'0.82rem',color:'#a6adc8',marginBottom:12}}>Scans all {RECIPES.length} recipes and reports how many recipes each non-spice ingredient appears in.</p>
          <button className="btn btn-debug" onClick={runIngredientAnalysis} style={{marginBottom:16}}>Run Ingredient Analysis</button>

          {ingAnalysis && (<>
            <div className="dbg-summary">{ingAnalysis.totalIngredients} unique ingredients across {ingAnalysis.totalRecipes} recipes. Red = &lt;5 recipes, Yellow = 5 recipes, Green = 6+ recipes.</div>

            <h3>Full Ingredient Frequency (least to most used)</h3>
            {ingAnalysis.all.map(function(ing) {
              var cls = ing.count < 5 ? "dbg-ing-red" : (ing.count === 5 ? "dbg-ing-yellow" : "dbg-ing-green");
              return (<div className={"dbg-ing-row " + cls} key={ing.name}>
                <span className="di-name">{ing.name}</span>
                <span className="di-count">{ing.count}</span>
                <span className="di-recipes">{ing.recipes.join(", ")}</span>
              </div>);
            })}

            <h3>Flagged Ingredients (&lt;5 recipes)</h3>
            <div className="dbg-summary">{ingAnalysis.affectedCount} of {ingAnalysis.totalRecipes} recipes contain at least one flagged ingredient.</div>

            {ingAnalysis.unique.length > 0 && (<>
              <h3 style={{fontSize:'0.9rem',borderBottom:'none',paddingBottom:0}}>Unique to One Recipe ({ingAnalysis.unique.length})</h3>
              <ul className="dbg-list">{ingAnalysis.unique.map(function(ing) {
                return <li key={ing.name}><span style={{color:'#f38ba8',fontWeight:600}}>{ing.name}</span> — {ing.recipes[0]}</li>;
              })}</ul>
            </>)}

            {ingAnalysis.rare.length > 0 && (<>
              <h3 style={{fontSize:'0.9rem',borderBottom:'none',paddingBottom:0}}>Rare: 2-4 Recipes ({ingAnalysis.rare.length})</h3>
              <ul className="dbg-list">{ingAnalysis.rare.map(function(ing) {
                return <li key={ing.name}><span className="dbg-warn">{ing.name}</span> ({ing.count}) — {ing.recipes.join(", ")}</li>;
              })}</ul>
            </>)}

            <div style={{marginTop:20}}><button className="btn btn-debug" onClick={function() {
              var report = {
                timestamp: new Date().toISOString(),
                totalIngredients: ingAnalysis.totalIngredients,
                totalRecipes: ingAnalysis.totalRecipes,
                affectedRecipeCount: ingAnalysis.affectedCount,
                ingredients: ingAnalysis.all.map(function(i) { return { name: i.name, recipeCount: i.count, recipes: i.recipes }; }),
                uniqueToOneRecipe: ingAnalysis.unique.map(function(i) { return { name: i.name, recipe: i.recipes[0] }; }),
                rare2to4: ingAnalysis.rare.map(function(i) { return { name: i.name, count: i.count, recipes: i.recipes }; })
              };
              var blob = new Blob([JSON.stringify(report, null, 2)], { type: "application/json" });
              var url = URL.createObjectURL(blob);
              var a = document.createElement("a"); a.href = url; a.download = "ingredient-frequency-report.json"; a.click();
              URL.revokeObjectURL(url);
            }}>Download Ingredient Report</button></div>
          </>)}
        </div>

        <div style={{borderTop:'1px solid #45475a',marginTop:24,paddingTop:20}}>
          <h2 style={{color:'#f38ba8',fontSize:'1.15rem',marginBottom:12}}>Validate Meal Plan Quality</h2>
          <p style={{fontSize:'0.82rem',color:'#a6adc8',marginBottom:12}}>Generates 100 complete meal plans using the full pipeline (selection + adjustDayMeals + protein rescue + shake) and flags pathological outputs.</p>
          <button className="btn btn-debug" onClick={runValidation} disabled={!!validationProgress} style={{marginBottom:16}}>{validationProgress ? "Validating..." : "Run Validation (100 plans)"}</button>

          {validationProgress && (<div className="dbg-progress">
            <div style={{fontSize:'0.88rem',color:'#cdd6f4'}}>Validating... {validationProgress.done} / {validationProgress.total} plans</div>
            <div className="dbg-progress-bar"><div className="dbg-progress-fill" style={{width: Math.round(validationProgress.done/validationProgress.total*100)+"%"}}></div></div>
          </div>)}

          {validationResults && (<>
            <div className="dbg-summary">
              <strong>{validationResults.totalDays}</strong> days across 100 plans. Pass = all 4 macros within 95-105% of target + no ingredient &gt;500g.<br/>
              <strong style={{color: validationResults.flaggedDays === 0 ? '#a6e3a1' : '#f38ba8'}}>{validationResults.passedDays}/{validationResults.totalDays}</strong> passed ({validationResults.passPct}%).{" "}
              <strong style={{color:'#f38ba8'}}>{validationResults.flaggedDays}</strong> flagged.
            </div>

            <h3>Flag Breakdown (95-105% thresholds)</h3>
            <ul className="dbg-list">
              <li>Calories &gt;105%: <strong>{validationResults.flagCounts.calHigh}</strong></li>
              <li>Calories &lt;95%: <strong>{validationResults.flagCounts.calLow}</strong></li>
              <li>Carbs &gt;105%: <strong>{validationResults.flagCounts.carbsHigh}</strong></li>
              <li>Carbs &lt;95%: <strong>{validationResults.flagCounts.carbsLow}</strong></li>
              <li>Protein &gt;105%: <strong>{validationResults.flagCounts.proHigh}</strong></li>
              <li>Protein &lt;95%: <strong>{validationResults.flagCounts.proLow}</strong></li>
              <li>Fat &gt;105%: <strong>{validationResults.flagCounts.fatHigh}</strong></li>
              <li>Fat &lt;95%: <strong>{validationResults.flagCounts.fatLow}</strong></li>
              <li>Ingredient &gt;1000g: <strong>{validationResults.flagCounts.ingOver500}</strong></li>
              <li>Shake added, protein still &lt;95%: <strong>{validationResults.flagCounts.shakeStillLow}</strong></li>
              <li>Rescue active, carbs &gt;105%: <strong>{validationResults.flagCounts.rescueCarbBlown}</strong></li>
            </ul>

            <h3>Worst Values Seen (range)</h3>
            <ul className="dbg-list">
              <li>Calories: <strong>{round1(validationResults.worst.caloriesLow)}</strong> – <strong>{round1(validationResults.worst.caloriesHigh)}</strong> (target {validationResults.targets.calories})</li>
              <li>Carbs: <strong>{round1(validationResults.worst.carbsLow)}g</strong> – <strong>{round1(validationResults.worst.carbsHigh)}g</strong> (target {round1(validationResults.targets.carbs)}g)</li>
              <li>Protein: <strong>{round1(validationResults.worst.proteinLow)}g</strong> – <strong>{round1(validationResults.worst.proteinHigh)}g</strong> (target {round1(validationResults.targets.protein)}g)</li>
              <li>Fat: <strong>{round1(validationResults.worst.fatLow)}g</strong> – <strong>{round1(validationResults.worst.fatHigh)}g</strong> (target {round1(validationResults.targets.fat)}g)</li>
            </ul>

            {validationResults.flagged.length > 0 && (<>
              <h3>Flagged Days ({validationResults.flagged.length})</h3>
              {validationResults.flagged.slice(0, 50).map(function(entry, idx) {
                return (<div key={idx} style={{background:'#313244',borderRadius:6,padding:8,marginBottom:6,fontSize:'0.82rem',borderLeft:'3px solid #f38ba8'}}>
                  <div><strong>Week {entry.week}, {entry.dayName}</strong>: {entry.meals.join(" + ")}</div>
                  <div style={{color:'#a6adc8'}}>Cal: {entry.totals.calories} ({entry.pcts.calories}%) | C: {entry.totals.carbs}g ({entry.pcts.carbs}%) | P: {entry.totals.protein}g ({entry.pcts.protein}%) | F: {entry.totals.fat}g ({entry.pcts.fat}%){entry.shake ? " + shake" : ""}{entry.rescue ? " + rescue" : ""}</div>
                  {entry.flags.map(function(f, fi) { return <div key={fi} style={{color:'#f38ba8',fontSize:'0.78rem'}}>  {f}</div>; })}
                </div>);
              })}
              {validationResults.flagged.length > 50 && <div style={{color:'#a6adc8',fontSize:'0.82rem'}}>...and {validationResults.flagged.length - 50} more flagged days</div>}
            </>)}

            <div style={{marginTop:20,display:"flex",gap:8,flexWrap:"wrap"}}><button className="btn btn-debug" onClick={function() {
              var blob = new Blob([JSON.stringify({
                timestamp: validationResults.timestamp,
                targets: validationResults.targets,
                thresholds: "95-105% for all macros",
                totalDays: validationResults.totalDays,
                passedDays: validationResults.passedDays,
                passPct: validationResults.passPct,
                flagCounts: validationResults.flagCounts,
                worstValues: validationResults.worst,
                flaggedDays: validationResults.flagged
              }, null, 2)], { type: "application/json" });
              var url = URL.createObjectURL(blob);
              var a = document.createElement("a"); a.href = url; a.download = "meal-plan-validation-report.json"; a.click();
              URL.revokeObjectURL(url);
            }}>Download Validation Report</button>
            {validationResults.solverDiagnostics && validationResults.solverDiagnostics.length > 0 && <button className="btn btn-debug" onClick={function() {
              var blob = new Blob([JSON.stringify({
                timestamp: validationResults.timestamp,
                targets: validationResults.targets,
                totalFailures: validationResults.solverDiagnostics.length,
                failures: validationResults.solverDiagnostics
              }, null, 2)], { type: "application/json" });
              var url = URL.createObjectURL(blob);
              var a = document.createElement("a"); a.href = url; a.download = "solver-diagnostics.json"; a.click();
              URL.revokeObjectURL(url);
            }}>Download Solver Diagnostics ({validationResults.solverDiagnostics.length})</button>}
            </div>
          </>)}
        </div>
      </div>)}

      {detailModal && plan && plan[detailModal.dayIdx] && (function() {
        var di = detailModal.dayIdx, mi = detailModal.mealIdx;
        var day = plan[di];
        var meal = day.meals[mi];
        if (!meal) return null;
        var mealKey = di + "-" + mi;
        var isEaten = !!eatenMeals[mealKey];
        var servings = mealServings[mealKey] || 1;
        var recipeData = RECIPES.find(function(r) { return r.name === meal.originalName; });
        var cookData = RECIPE_COOKING_DATA[meal.originalName];
        var mainIngs = meal.ingredients.filter(function(x) { return !x.isSpice; });
        var spiceIngs = meal.ingredients.filter(function(x) { return x.isSpice; });
        return (<div className="md-overlay" onClick={function(e){if(e.target===e.currentTarget){setDetailModal(null);setDetailInstrOpen(false);}}}>
          <div className="md-modal">
            <div className="md-header">
              <div className="md-header-top">
                <div className="md-header-left">
                  <span className="md-title">{meal.name}</span>
                  {/* Variant recipes differ in ways that matter at the stove and in the cart
                      (Shawarma Bowl: chicken breast + yogurt vs chicken thigh, no yogurt), so the
                      name alone is ambiguous. Both generatePlan and handleSwap store this label;
                      until now nothing rendered it. */}
                  {meal.variantLabel && <span className="variant-tag">{meal.variantLabel}</span>}
                  <span className="cuisine-tag">{meal.cuisine}</span>
                </div>
                <button className="md-close" onClick={function(){setDetailModal(null);setDetailInstrOpen(false);}}>{"\u2715"}</button>
              </div>
              <div className="md-context">{DAYS_NAMES[di]} {"\u00B7"} Meal {mi + 1}</div>
            </div>
            <div className="md-macrobar">
              <div className="md-macrobar-left">
                <span className="md-macrobar-cal">{Math.round(meal.totalMacros.calories)} cal</span>
                <span className="md-macrobar-detail">C: {Math.round(meal.totalMacros.carbs)}g {"  "} P: {Math.round(meal.totalMacros.protein)}g {"  "} F: {Math.round(meal.totalMacros.fat)}g</span>
              </div>
              <span className="servings-ctrl">
                <button onClick={function(){changeServing(di, mi, -1);}}>−</button>
                <span className="sv-val">{servings}</span>
                <button onClick={function(){changeServing(di, mi, 1);}}>+</button>
              </span>
            </div>
            <div className="md-body">
              <table className="md-ing-table">
                <thead><tr><th>Ingredient</th><th>Qty</th><th>Cal</th><th>C</th><th>P</th><th>F</th></tr></thead>
                <tbody>
                  {mainIngs.map(function(ing, ii) {
                    return (<React.Fragment key={ii}>
                      <tr>
                        <td>{ing.name}</td>
                        <td>{ingQtyDisplay(ing)}</td>
                        <td>{round1(ing.calories)}</td>
                        <td>{round1(ing.carbs)}</td>
                        <td>{round1(ing.protein)}</td>
                        <td>{round1(ing.fat)}</td>
                      </tr>
                      {ing.adjustment && <tr><td colSpan={6}><div className="md-adj-note">{"\u26A0\uFE0F"} {ing.adjustment}</div></td></tr>}
                    </React.Fragment>);
                  })}
                  {/* Spices are zero-macro by definition, so the five em-dash cells carried no
                      information and squeezed the name list into the narrow first column \u2014
                      eight wrapped lines on a phone. One full-width cell instead. */}
                  {spiceIngs.length > 0 && <tr className="md-spice-row"><td colSpan={6}>{spiceIngs.map(function(s){return s.name;}).join(", ")}</td></tr>}
                </tbody>
              </table>
              {cookData && cookData.steps && (<>
                <button className="md-instr-toggle" onClick={function(){setDetailInstrOpen(!detailInstrOpen);}}>{detailInstrOpen ? "\u25BC" : "\u25B6"} Cooking instructions</button>
                {detailInstrOpen && <div className="md-instr-list"><ol>{cookData.steps.map(function(step, si) { return <li key={si}>{step}</li>; })}</ol></div>}
              </>)}
            </div>
            <div className="md-actions">
              <button className="md-btn-swap" onClick={function(){setDetailModal(null);setDetailInstrOpen(false);setSwapTarget({dayIdx:di,mealIdx:mi});setSwapSearch("");}}>Swap meal</button>
              <button className="md-btn-remove" onClick={function(){handleRemoveMeal(di, mi);}}>Remove meal</button>
              <button className={"md-btn-fav" + (favorites[meal.originalName] ? " active" : "")} onClick={function(){toggleFavorite(meal.originalName);}}>{favorites[meal.originalName] ? "\u2605 Favorited" : "\u2606 Favorite"}</button>
              <button className={"md-btn-eaten" + (isEaten ? " active" : "")} onClick={function(){toggleEaten(di, mi);}}>{isEaten ? "Unmark eaten" : "Mark eaten \u2713"}</button>
            </div>
          </div>
        </div>);
      })()}

      {swapTarget && (function() {
        // A plain, complete list. There is deliberately no macro-fit ranking and no compatible /
        // incompatible split: that was a solver dry-run per candidate, and its non-determinism
        // mislabelled workable recipes as incompatible (the S4 false-negative bug, removed S13).
        // Every recipe is pickable, the day re-solves around the pick, and swapWarning reports
        // afterwards if the result lands outside 95-105%. Favorites sort first, then alphabetical.
        var q = swapSearch.toLowerCase();
        var listed = RECIPES.filter(function(r) {
          return !q || r.name.toLowerCase().indexOf(q) !== -1 || r.cuisine.toLowerCase().indexOf(q) !== -1;
        }).slice().sort(function(a, b) {
          var fa = favorites[a.name] ? 0 : 1, fb = favorites[b.name] ? 0 : 1;
          return fa !== fb ? fa - fb : a.name.localeCompare(b.name);
        });
        var favCount = listed.filter(function(r) { return favorites[r.name]; }).length;
        return (<div className="modal-overlay" onClick={function(e){if(e.target===e.currentTarget)setSwapTarget(null);}}>
        <div className="modal">
          <h3>{swapTarget.isAdd ? "Add Meal" : "Swap Recipe"} — {DAYS_NAMES[swapTarget.dayIdx]}, Meal {swapTarget.mealIdx+1}</h3>
          <p style={{fontSize:'0.82rem',color:'#6b7f7a',marginBottom:8}}>
            {"Pick any recipe — the day re-solves around it" + (swapTarget.isAdd ? ", rescaling every meal to fit." : ".")}
          </p>
          <input className="modal-search" placeholder="Search by name or cuisine..." value={swapSearch} onChange={function(e){setSwapSearch(e.target.value);}} autoFocus />
          <div style={{maxHeight:'50vh',overflowY:'auto'}}>
            {listed.map(function(r, i) {
              var isFav = !!favorites[r.name];
              // One divider at the favorites/rest boundary, and only when both sides are non-empty.
              var showDivider = favCount > 0 && i === favCount && favCount < listed.length;
              return (<React.Fragment key={r.name}>
                {showDivider && <div style={{borderTop:'1px solid #e0e8e4',margin:'10px 0 8px'}}></div>}
                <div className="modal-recipe" onClick={function(){handleSwap(r);}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',gap:8}}>
                    <span>
                      {isFav && <span style={{color:'#f5c518',marginRight:4}}>{"★"}</span>}
                      <span className="mr-name">{r.name}</span> <span className="mr-cuisine">— {r.cuisine}</span>
                    </span>
                    <span className="mr-cuisine" style={{whiteSpace:'nowrap'}}>{Math.round(r.totalMacros.calories)} cal</span>
                  </div>
                  <div className="mr-macros">C: {round1(r.totalMacros.carbs)}g | P: {round1(r.totalMacros.protein)}g | F: {round1(r.totalMacros.fat)}g</div>
                </div>
              </React.Fragment>);
            })}
            {listed.length === 0 && <div style={{padding:'16px 0',color:'#6b7f7a',textAlign:'center',fontSize:'0.88rem'}}>No recipes match your search.</div>}
          </div>
          <div style={{marginTop:12,display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
            <span style={{fontSize:'0.78rem',color:'#9aa8a3'}}>{listed.length} of {RECIPES.length} recipes</span>
            <button className="btn btn-sm btn-secondary" onClick={function(){setSwapTarget(null);}}>Cancel</button>
          </div>
        </div>
      </div>);
      })()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
