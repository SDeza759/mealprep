<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dialed" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <title>Dialed</title>
    <script>
      // Paint the saved theme before the bundle loads so a light-mode user never sees a dark flash
      // (and vice versa). Settings live in IndexedDB; this mirror is written by ThemeProvider.
      (function () {
        try {
          var root = document.documentElement;
          var t = localStorage.getItem('dialed:theme');
          if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t);
          var a = localStorage.getItem('dialed:accent');
          var m = { orange: ['#FF6B35', '#D9501B'], lime: ['#7CFF6B', '#2A8F1F'], sky: ['#5AB8FF', '#1F7FD6'] }[a];
          if (m) { root.style.setProperty('--accent-dark', m[0]); root.style.setProperty('--accent-light', m[1]); }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
